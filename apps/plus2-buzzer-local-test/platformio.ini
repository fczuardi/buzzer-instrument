[platformio]
core_dir = ../../../.platformio-home
default_envs = m5stick-cplus2

[env:m5stick-cplus2]
platform = platformio/espressif32@7.0.1
board = m5stick-cplus2
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_flags =
  -pipe
lib_deps =
  monophonic-instrument=file://../../packages/monophonic-instrument
  m5-buzzer-output=file://../../packages/m5-buzzer-output
