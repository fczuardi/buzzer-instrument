name: CI

on:
  push:
  pull_request:

jobs:
  monophonic-package:
    name: Monophonic package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: .platformio-home
          key: platformio-monophonic-${{ runner.os }}-${{ hashFiles('packages/monophonic-instrument/platformio.ini', 'packages/monophonic-instrument/library.json') }}
          restore-keys: |
            platformio-monophonic-${{ runner.os }}-

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Run package native tests
        run: env PLATFORMIO_CORE_DIR=.platformio-home pio test -d packages/monophonic-instrument -e native

      - name: Pack monophonic package
        run: env PLATFORMIO_CORE_DIR=.platformio-home pio pkg pack packages/monophonic-instrument --output /tmp

      - name: Build temporary monophonic consumer
        run: |
          mkdir -p /tmp/monophonic-package-consumer/src
          cat > /tmp/monophonic-package-consumer/platformio.ini <<'EOF'
          [env:native]
          platform = native
          lib_deps =
            file://${{ github.workspace }}/packages/monophonic-instrument
          EOF
          cat > /tmp/monophonic-package-consumer/src/main.cpp <<'EOF'
          #include "MonophonicInstrument.h"

          int main() {
            MonophonicInstrument instrument;
            const VoiceAction action = instrument.noteOn(69, 100);
            return action.type == VoiceActionType::StartNote ? 0 : 1;
          }
          EOF
          env PLATFORMIO_CORE_DIR=.platformio-home pio run -d /tmp/monophonic-package-consumer

  m5-buzzer-output-package:
    name: M5 buzzer output package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: .platformio-home
          key: platformio-m5-buzzer-output-${{ runner.os }}-${{ hashFiles('packages/m5-buzzer-output/platformio.ini', 'packages/m5-buzzer-output/library.json', 'packages/monophonic-instrument/library.json') }}
          restore-keys: |
            platformio-m5-buzzer-output-${{ runner.os }}-

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Pack M5 buzzer output package
        run: env PLATFORMIO_CORE_DIR=.platformio-home pio pkg pack packages/m5-buzzer-output --output /tmp

      - name: Build temporary M5 buzzer output consumer
        run: |
          mkdir -p /tmp/m5-buzzer-output-consumer/src
          cat > /tmp/m5-buzzer-output-consumer/platformio.ini <<'EOF'
          [env:esp32dev]
          platform = platformio/espressif32@7.0.1
          board = esp32dev
          framework = arduino
          lib_deps =
            monophonic-instrument=file://${{ github.workspace }}/packages/monophonic-instrument
            m5-buzzer-output=file://${{ github.workspace }}/packages/m5-buzzer-output
          EOF
          cat > /tmp/m5-buzzer-output-consumer/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <M5Unified.h>

          #include "MonophonicInstrument.h"
          #include "MonophonicInstrumentSink.h"
          #include "SpeakerToneOutput.h"

          MonophonicInstrument instrument;
          SpeakerToneOutput output;
          MonophonicInstrumentSink sink(instrument, output);

          void setup() {
            output.setWaveform(instrument.waveform());
            output.setVelocityVolumeRange({64, 128});
            sink.onNoteEvent({NoteEventType::NoteOn, 1, 60, 100});
            sink.onNoteEvent({NoteEventType::NoteOff, 1, 60, 0});
          }

          void loop() {}
          EOF
          env PLATFORMIO_CORE_DIR=.platformio-home pio run -d /tmp/m5-buzzer-output-consumer

  plus2-buzzer-local-test:
    name: Plus2 buzzer local test app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: .platformio-home
          key: platformio-plus2-buzzer-local-test-${{ runner.os }}-${{ hashFiles('apps/plus2-buzzer-local-test/platformio.ini', 'packages/*/library.json') }}
          restore-keys: |
            platformio-plus2-buzzer-local-test-${{ runner.os }}-

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Build app
        run: env PLATFORMIO_CORE_DIR=.platformio-home pio run -d apps/plus2-buzzer-local-test
