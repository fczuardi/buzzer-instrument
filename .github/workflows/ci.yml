name: CI

on:
  push:
  pull_request:

jobs:
  monophonic-package:
    name: Monophonic package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: .platformio-home
          key: platformio-monophonic-${{ runner.os }}-${{ hashFiles('packages/monophonic-instrument/platformio.ini', 'packages/monophonic-instrument/library.json', 'ci/consumers/monophonic-package/platformio.ini', 'ci/consumers/monophonic-package/src/main.cpp') }}
          restore-keys: |
            platformio-monophonic-${{ runner.os }}-

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Run package native tests
        run: env PLATFORMIO_CORE_DIR=.platformio-home pio test -d packages/monophonic-instrument -e native

      - name: Pack monophonic package
        run: env PLATFORMIO_CORE_DIR=.platformio-home pio pkg pack packages/monophonic-instrument --output /tmp

      - name: Build monophonic consumer
        run: env PLATFORMIO_CORE_DIR=.platformio-home pio run -d ci/consumers/monophonic-package

  m5-tone-output-package:
    name: M5 tone output package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: .platformio-home
          key: platformio-m5-tone-output-${{ runner.os }}-${{ hashFiles('packages/m5-tone-output/platformio.ini', 'packages/m5-tone-output/library.json', 'packages/monophonic-instrument/library.json', 'ci/consumers/m5-tone-output/platformio.ini', 'ci/consumers/m5-tone-output/src/main.cpp') }}
          restore-keys: |
            platformio-m5-tone-output-${{ runner.os }}-

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Pack M5 tone output package
        run: env PLATFORMIO_CORE_DIR=.platformio-home pio pkg pack packages/m5-tone-output --output /tmp

      - name: Build M5 tone output consumer
        run: env PLATFORMIO_CORE_DIR=.platformio-home pio run -d ci/consumers/m5-tone-output

  plus2-buzzer-local-test:
    name: Plus2 buzzer local test app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: .platformio-home
          key: platformio-plus2-buzzer-local-test-${{ runner.os }}-${{ hashFiles('apps/plus2-buzzer-local-test/platformio.ini', 'packages/*/library.json') }}
          restore-keys: |
            platformio-plus2-buzzer-local-test-${{ runner.os }}-

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Build app
        run: env PLATFORMIO_CORE_DIR=.platformio-home pio run -d apps/plus2-buzzer-local-test
