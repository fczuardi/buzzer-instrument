[platformio]
default_envs = m5stick-cplus2

[env]
lib_deps =
  EmbeddedMusicFirmwareContracts=https://github.com/fczuardi/embedded-music-experiments.git#154035d94df99ab05c3eeb7eb144bf2012972ada

[env:m5stick-cplus2]
platform = platformio/espressif32@7.0.1
board = m5stick-cplus2
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_deps =
  ${env.lib_deps}
  m5stack/M5Unified@0.2.17

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
  +<MidiNote.cpp>
  +<MonophonicInstrument.cpp>
  +<MonophonicInstrumentSink.cpp>
  +<ToneWaveform.cpp>
